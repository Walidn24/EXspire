version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: exspire-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: exspire-phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - mysql

  botexpire:
    build: .
    depends_on:
      - mysql
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      BOT_TOKEN: ${BOT_TOKEN}

volumes:
  mysql_data:
